name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" AionClient.exe AionClient.exe.sha256 --title "Aion Client $GITHUB_REF_NAME" --notes "Lade AionClient.exe herunter. Die Einrichtung steht in der README."
        env:
          GH_TOKEN: ${{ github.token }}

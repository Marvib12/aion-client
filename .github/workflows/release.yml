name: Release

on:
  push:
    branches:
      - main
    paths:
      - version.txt
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="v$(cat version.txt)"
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" AionClient.exe AionClient.exe.sha256 --title "Aion Client $tag" --notes "Lade AionClient.exe herunter. Die Einrichtung steht in der README."
        env:
          GH_TOKEN: ${{ github.token }}
